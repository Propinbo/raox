name: Legacy Windows build

on:
  push:
    paths-ignore:
      - '**/*.md'
      - recovery/evidence/**
  pull_request:
    paths-ignore:
      - '**/*.md'
      - recovery/evidence/**
  workflow_dispatch:
    inputs:
      run_ui:
        description: Run the separate 42 RCPTT UI checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download and verify JDK
        run: ./recovery/Initialize-Toolchains.ps1
      # Deliberately do not restore a cache: every run checks all artifact sources.
      - name: Build from an empty Maven, p2 and wrapper cache
        run: ./recovery/Invoke-LegacyBuild.ps1 -Clean -RequireEmptyCache -Goal verify
      - name: Rebuild with Maven offline
        run: ./recovery/Invoke-LegacyBuild.ps1 -Clean -Goal verify -Offline
      - name: Upload plugins, JUnit reports and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-windows-build
          include-hidden-files: true
          if-no-files-found: error
          path: |
            assembly/target/raox-3.9.0.zip
            assembly/target/plugins/*.jar
            ru.bmstu.rk9.rao.tests/target/surefire-reports/
            .build/evidence/

  ui:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui
    needs: build
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: legacy-windows-build
      - name: Download and verify JDK, historical Eclipse and RCPTT
        run: ./recovery/Initialize-Toolchains.ps1 -IncludeUi
      - name: Run UI checks and validate exported data
        run: |
          ./recovery/Invoke-RcpttTests.ps1 `
            -JavaHome .build/tools/jdk8u504-b01 `
            -RunnerRoot .build/tools/rcptt/eclipse `
            -AutRoot .build/tools/eclipse/raox-eclipse-3.9.0-win-x64 `
            -PluginsRoot assembly/target/plugins `
            -LogRoot .build/ui-evidence
          $latestRun = Get-ChildItem .build/ui-evidence -Directory | Sort-Object Name | Select-Object -Last 1
          ./recovery/Test-UiExports.ps1 -RunRoot $latestRun.FullName
      - name: Upload RCPTT HTML, JUnit, logs and exports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-windows-ui
          include-hidden-files: true
          if-no-files-found: error
          path: .build/ui-evidence/
